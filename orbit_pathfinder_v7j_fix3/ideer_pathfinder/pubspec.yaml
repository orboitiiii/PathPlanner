name: orbit_pathfinder
description: Minimal pathfinder MVP (v7e) with bottom-left origin and pass point UI.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5
  window_manager: ^0.3.8
  flutter_riverpod: ^3.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/2025-field.png
